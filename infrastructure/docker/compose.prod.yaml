# Production-like stack. Images are built on GitHub and pulled from ghcr.io (DCMS_TAG = commit SHA); `build:` stays for manual builds.
# Production-like stack for a VPN-only server. See docs/implementation/DEPLOY-SERVER-WIREGUARD.vi.md.
# Run from the repository root:
#   docker compose --env-file .env -f infrastructure/docker/compose.prod.yaml up -d --build
name: dcms
x-api-env: &api-env
  ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
  Jwt__SigningKey: ${JWT_SIGNING_KEY:?Set JWT_SIGNING_KEY in .env}
  Cors__AllowedOrigins__0: ${PUBLIC_WEB_URL:?Set PUBLIC_WEB_URL in .env}
  ClinicalDocuments__StoragePath: /data/clinical-documents
  BranchAssets__StoragePath: /data/branch-assets
  DevSeed__Password: ${DEV_SEED_PASSWORD:-}
  Google__WebClientId: ${GOOGLE_WEB_CLIENT_ID:-}
  Smtp__Host: ${SMTP_HOST:-}
  Smtp__Port: ${SMTP_PORT:-465}
  Smtp__EnableSsl: ${SMTP_ENABLE_SSL:-true}
  Smtp__UserName: ${SMTP_USERNAME:-}
  Smtp__Password: ${SMTP_PASSWORD:-}
  Smtp__FromAddress: ${SMTP_FROM_ADDRESS:-}
  Smtp__FromName: ${SMTP_FROM_NAME:-DCMS}
  PayOs__ClientId: ${PAYOS_CLIENT_ID:-}
  PayOs__ApiKey: ${PAYOS_API_KEY:-}
  PayOs__ChecksumKey: ${PAYOS_CHECKSUM_KEY:-}
  # AI X-ray (docs/specs/AI-CARIES-DETECTION.vi.md §10): http://ai:8090 when the "ai" profile runs; empty disables it.
  DentalAi__BaseUrl: ${DENTAL_AI_BASE_URL:-}
  DentalAi__ApiKey: ${DENTAL_AI_API_KEY:-}
  DentalAi__TimeoutSeconds: ${DENTAL_AI_TIMEOUT_SECONDS:-120}
  TZ: Asia/Ho_Chi_Minh
x-api-volumes: &api-volumes
  - dcms_clinical_documents:/data/clinical-documents
  - dcms_branch_assets:/data/branch-assets
  - dcms_dataprotection:/home/app/.aspnet
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - dcms_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    build: { context: ../../backend }
    image: ${DCMS_REGISTRY:-ghcr.io/tu2005tktn}/dcms-api:${DCMS_TAG:-latest}
    restart: unless-stopped
    environment: *api-env
    volumes: *api-volumes
    depends_on:
      postgres: { condition: service_healthy }
  web:
    build: { context: ../../web }
    image: ${DCMS_REGISTRY:-ghcr.io/tu2005tktn}/dcms-web:${DCMS_TAG:-latest}
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on: [api]
  # Optional AI X-ray service (CPU). Enable with "ai" in COMPOSE_PROFILES; weights stay on the server, mounted read-only.
  ai:
    image: ${DCMS_REGISTRY:-ghcr.io/tu2005tktn}/dcms-ai:${DCMS_TAG:-latest}
    build: { context: ../../ai-service }
    profiles: ["ai"]
    restart: unless-stopped
    environment:
      AI_CARIES_WEIGHTS: /models/${AI_CARIES_WEIGHTS_FILE:-recommended_caries_best.pt}
      AI_SERVICE_API_KEY: ${DENTAL_AI_API_KEY:-}
      AI_DEVICE: cpu
      OMP_NUM_THREADS: ${AI_CPU_THREADS:-2}
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - ${AI_MODELS_DIR:-/opt/dcms/ai-models}:/models:ro
    mem_limit: ${AI_MEMORY_LIMIT:-1500m}
  # Public access through Cloudflare Tunnel; enable with COMPOSE_PROFILES=public in .env.
  cloudflared:
    image: cloudflare/cloudflared:2025.8.1
    profiles: ["public"]
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on: [web]
  # One-off jobs: Program.cs only allows these commands in Development, so they run in a short-lived container.
  migrate:
    image: ${DCMS_REGISTRY:-ghcr.io/tu2005tktn}/dcms-api:${DCMS_TAG:-latest}
    profiles: ["tools"]
    environment:
      <<: *api-env
      ASPNETCORE_ENVIRONMENT: Development
    volumes: *api-volumes
    depends_on:
      postgres: { condition: service_healthy }
    command: ["--migrate"]
  seed:
    image: ${DCMS_REGISTRY:-ghcr.io/tu2005tktn}/dcms-api:${DCMS_TAG:-latest}
    profiles: ["tools"]
    environment:
      <<: *api-env
      ASPNETCORE_ENVIRONMENT: Development
    volumes: *api-volumes
    depends_on:
      postgres: { condition: service_healthy }
    entrypoint: ["sh", "-c", "dotnet DCMS.Api.dll --seed-demo && dotnet DCMS.Api.dll --seed-clinic-catalog"]
volumes:
  dcms_postgres_data:
  dcms_clinical_documents:
  dcms_branch_assets:
  dcms_dataprotection:
