name: Deploy server

# Images are built on a GitHub-hosted runner and pushed to ghcr.io; the self-hosted
# server runner only pulls and restarts. See docs/implementation/DEPLOY-SERVER-WIREGUARD.vi.md.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-server
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io/tu2005tktn

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: dcms-api
            context: backend
          - name: dcms-web
            context: web
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ matrix.name }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ matrix.name }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy:
    needs: build
    runs-on: [self-hosted, dcms-prod]
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    env:
      COMPOSE: docker compose -p dcms --env-file /opt/dcms/.env -f infrastructure/docker/compose.prod.yaml
      DCMS_REGISTRY: ghcr.io/tu2005tktn
      DCMS_TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to ghcr.io (read-only, this run only)
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      # ClamAV is optional (~1.5-2.5 GB RAM); remove it unless /opt/dcms/.env sets CLINICAL_ANTIVIRUS=ClamAv.
      - name: Stop ClamAV when antivirus is disabled
        run: grep -qx 'CLINICAL_ANTIVIRUS=ClamAv' /opt/dcms/.env || $COMPOSE --profile antivirus rm -sf clamav

      - name: Pull images
        run: $COMPOSE pull api web

      - name: Start database
        run: $COMPOSE up -d --wait postgres

      - name: Apply migrations
        run: $COMPOSE --profile tools run --rm migrate

      # Starts every default service plus profiles listed in COMPOSE_PROFILES (e.g. "public" for the tunnel).
      - name: Restart services
        run: $COMPOSE up -d --remove-orphans

      - name: Wait for health
        run: |
          for i in $(seq 1 40); do
            if curl -fsS http://localhost/health | grep -q '"api":"healthy","database":"healthy"'; then
              curl -sS http://localhost/health; echo; exit 0
            fi
            sleep 3
          done
          echo "Health check failed"; $COMPOSE logs --tail 80 api; exit 1

      - name: Log out and prune old images
        if: always()
        run: |
          docker logout ghcr.io || true
          docker image prune -af --filter "until=168h" --filter "label=org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" || true
